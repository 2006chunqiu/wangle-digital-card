<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="王乐的插画头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6F88A"/>
      <stop offset="1" stop-color="#B8E552"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F0C39B"/>
      <stop offset="1" stop-color="#DCA173"/>
    </linearGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A4937"/>
      <stop offset="1" stop-color="#0E2C21"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#26342C"/>
      <stop offset="1" stop-color="#131B17"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="320" cy="320" r="300"/>
    </clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <circle cx="320" cy="320" r="300" fill="url(#bg)"/>
  <g clip-path="url(#round)">
    <circle cx="320" cy="290" r="236" fill="none" stroke="#123A2A" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="320" cy="290" r="196" fill="none" stroke="#123A2A" stroke-opacity=".08" stroke-width="2"/>
    <path d="M56 214c64-102 176-166 304-166 66 0 128 17 180 48" fill="none" stroke="#F7FFE7" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
    <g fill="#123A2A" opacity=".13">
      <circle cx="102" cy="150" r="4"/><circle cx="132" cy="150" r="4"/><circle cx="162" cy="150" r="4"/>
      <circle cx="102" cy="180" r="4"/><circle cx="132" cy="180" r="4"/><circle cx="162" cy="180" r="4"/>
      <circle cx="102" cy="210" r="4"/><circle cx="132" cy="210" r="4"/><circle cx="162" cy="210" r="4"/>
    </g>
    <ellipse cx="320" cy="540" rx="190" ry="130" fill="#0D2C20" opacity=".18" filter="url(#soft)"/>

    <!-- shoulders -->
    <path d="M101 640c8-116 77-184 219-184s211 68 219 184z" fill="url(#sweater)"/>
    <path d="M222 480c26 45 58 67 98 67s72-22 98-67c-26-18-59-28-98-28s-72 10-98 28z" fill="#0D2A1F"/>
    <path d="M286 449h68l12 44c-24 20-68 20-92 0z" fill="#C88E62"/>

    <!-- neck -->
    <path d="M270 368h100v83c-17 17-37 26-50 26s-33-9-50-26z" fill="url(#skin)"/>
    <path d="M270 368h100v27c-28 18-72 18-100 0z" fill="#C58A5E" opacity=".55"/>

    <!-- ears -->
    <ellipse cx="231" cy="302" rx="23" ry="37" fill="url(#skin)"/>
    <ellipse cx="409" cy="302" rx="23" ry="37" fill="url(#skin)"/>
    <path d="M229 289c8 4 11 14 7 24" fill="none" stroke="#B77950" stroke-width="5" stroke-linecap="round"/>
    <path d="M411 289c-8 4-11 14-7 24" fill="none" stroke="#B77950" stroke-width="5" stroke-linecap="round"/>

    <!-- face -->
    <path d="M237 236c0-77 36-121 83-121s84 44 84 121v57c0 67-38 117-84 117s-83-50-83-117z" fill="url(#skin)"/>
    <path d="M238 270c14 4 27-2 38-16-8 30-20 48-38 62z" fill="#D79A6B" opacity=".35"/>
    <path d="M402 270c-14 4-27-2-38-16 8 30 20 48 38 62z" fill="#D79A6B" opacity=".35"/>

    <!-- hair -->
    <path d="M228 257c-7-91 39-154 97-154 63 0 101 53 95 145-2 27-7 47-15 65 1-38-8-73-25-96-28 19-79 28-129 18-8 19-12 43-10 72-7-14-11-31-13-50z" fill="url(#hair)"/>
    <path d="M252 174c19-33 50-51 88-51 30 0 57 12 74 35-26-12-55-17-87-12-28 5-52 14-75 28z" fill="#3B4C41" opacity=".55"/>
    <path d="M397 212c13 16 18 43 16 74" fill="none" stroke="#3B4C41" stroke-width="9" stroke-linecap="round" opacity=".4"/>
    <path d="M240 220c-5 24-5 48-1 71" fill="none" stroke="#0F1713" stroke-width="12" stroke-linecap="round"/>

    <!-- eyebrows -->
    <path d="M264 278c13-8 28-9 43-4" fill="none" stroke="#1C2922" stroke-width="7" stroke-linecap="round"/>
    <path d="M335 274c15-5 30-3 42 5" fill="none" stroke="#1C2922" stroke-width="7" stroke-linecap="round"/>

    <!-- glasses -->
    <rect x="249" y="290" width="64" height="47" rx="18" fill="#F7FFE8" fill-opacity=".18" stroke="#143A2B" stroke-width="7"/>
    <rect x="328" y="290" width="64" height="47" rx="18" fill="#F7FFE8" fill-opacity=".18" stroke="#143A2B" stroke-width="7"/>
    <path d="M313 308h15" stroke="#143A2B" stroke-width="7" stroke-linecap="round"/>
    <path d="M249 303l-18-8M392 303l18-8" stroke="#143A2B" stroke-width="6" stroke-linecap="round"/>

    <!-- eyes -->
    <path d="M268 314c6-4 13-4 19 0" fill="none" stroke="#17251E" stroke-width="5" stroke-linecap="round"/>
    <path d="M347 314c6-4 13-4 19 0" fill="none" stroke="#17251E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="278" cy="316" r="3.8" fill="#17251E"/>
    <circle cx="357" cy="316" r="3.8" fill="#17251E"/>

    <!-- nose -->
    <path d="M319 334c-2 21-7 35-13 43 7 5 16 5 24 1" fill="none" stroke="#B97B51" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M295 385c15 7 35 7 50 0" fill="none" stroke="#7A4031" stroke-width="5" stroke-linecap="round"/>
    <path d="M301 401c9 10 28 10 38 0" fill="#8F4C3C" opacity=".8"/>

    <!-- shirt + collar -->
    <path d="M250 640c7-59 32-98 70-118l34 34 34-34c38 20 63 59 70 118z" fill="#F3EEDF"/>
    <path d="M320 556l-34-34 34-19 34 19z" fill="#E4DDCB"/>
    <path d="M286 522l34 34-13 84-45-97z" fill="#173C2D"/>
    <path d="M354 522l-34 34 13 84 45-97z" fill="#173C2D"/>

    <!-- sweater texture -->
    <g stroke="#8FC16E" stroke-opacity=".13" stroke-width="2">
      <path d="M145 640c16-87 61-142 133-168"/>
      <path d="M174 640c16-74 55-122 119-147"/>
      <path d="M495 640c-16-87-61-142-133-168"/>
      <path d="M466 640c-16-74-55-122-119-147"/>
    </g>
  </g>
  <circle cx="320" cy="320" r="298" fill="none" stroke="#0F2C20" stroke-opacity=".16" stroke-width="4"/>
</svg>
